<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Барное меню — Коктейли</title>
  <meta name="description" content="Барное меню: дайкири, мохито, текила санрайз, виски кола, апероль шприц, домашнее лимончелло. Состав, приготовление и фото." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <p class="hero__eyebrow">Plesko Bar</p>
    <h1 class="hero__title">Коктейльная карта</h1>
    <p class="hero__subtitle">Выберите коктейль, чтобы увидеть состав и способ приготовления</p>
  </header>

  <main class="wrap">
    <!-- Панель выбора -->
    <nav class="picker" aria-label="Выбор коктейля">
      <button class="picker__btn is-active" data-target="daiquiri">Дайкири</button>
      <button class="picker__btn" data-target="mojito">Мохито</button>
      <button class="picker__btn" data-target="tequila-sunrise">Текила санрайз</button>
      <button class="picker__btn" data-target="whiskey-cola">Виски кола</button>
      <button class="picker__btn" data-target="aperol-spritz">Апероль шприц</button>
      <button class="picker__btn" data-target="limoncello">Лимончелло</button>
    </nav>

    <section class="stage" id="stage"><!-- карточки вставляются из JS --></section>
  </main>

  <script src="menu.js"></script>
</body>
</html>
